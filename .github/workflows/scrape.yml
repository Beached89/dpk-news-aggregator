# The pipeline runs entirely off anyone's computer: GitHub Actions is the
# scheduler and the machine, and the export it writes is published either to
# GitHub Pages (needs nothing but this workflow) or to Cloudflare (R2 for state
# and images, Pages for hosting — all free tier).
#
# Minimum viable setup: none. With no credentials at all the scrape still runs,
# publishes from an empty database and the pages job puts the result on
# https://<user>.github.io/<repo>/ . State then does not persist between runs.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   secrets:    R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, CLOUDFLARE_API_TOKEN,
#               CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PAGES_PROJECT,
#               TRANSLATE_API_KEY (only for the deepl/google providers)
#   variables:  R2_ENDPOINT (https://<acct>.r2.cloudflarestorage.com), R2_BUCKET,
#               MEDIA_BASE, MIRROR_MEDIA, SCRAPE_*, MAX_AGE_HOURS, REQUEST_DELAY,
#               TRANSLATE_PROVIDER, TRANSLATE_TARGET
#
# With no R2 credentials the job still runs: it publishes from an empty database
# and uploads the result as a workflow artifact, which is a good way to try this
# out before wiring up storage (state then does not persist between runs).

name: Scrape, translate, publish

on:
  schedule:
    # GitHub's :00 slot is the most congested; a shifted minute schedules sooner.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum articles to fetch this run
        required: false
        default: '60'
      sources:
        description: 'Only these sources (kcna rodong vok magazine agriculture; blank = config defaults)'
        required: false
        default: ''
      fresh_state:
        description: Ignore the database stored in R2 and start from empty
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Two runs sharing one R2 database object would corrupt each other, so a scheduled
# run waits for a manual one instead of cancelling it.
concurrency:
  group: scrape-publish
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  DATA_DIR: ${{ github.workspace }}/data
  TRANSLATION_CACHE_PATH: ${{ github.workspace }}/data/translations.json
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  SCRAPE_KCNA: ${{ vars.SCRAPE_KCNA }}
  SCRAPE_RODONG: ${{ vars.SCRAPE_RODONG }}
  SCRAPE_38NORTH: ${{ vars.SCRAPE_38NORTH }}
  SCRAPE_DAILYNK: ${{ vars.SCRAPE_DAILYNK }}
  RSS_MIRROR_FULLTEXT: ${{ vars.RSS_MIRROR_FULLTEXT }}
  RSS_TRANSLATE_KO: ${{ vars.RSS_TRANSLATE_KO }}
  SCRAPE_VOK: ${{ vars.SCRAPE_VOK }}
  SCRAPE_MAGAZINES: ${{ vars.SCRAPE_MAGAZINES }}
  MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
  REQUEST_DELAY: ${{ vars.REQUEST_DELAY }}
  MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN }}
  TRANSLATE_PROVIDER: ${{ vars.TRANSLATE_PROVIDER || 'google_free' }}
  TRANSLATE_TARGET: ${{ vars.TRANSLATE_TARGET || 'EN-US' }}
  TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
  TRANSLATE_API_URL: ${{ vars.TRANSLATE_API_URL }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-scrape.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt

      - name: Show run configuration
        run: |
          echo "state store : ${R2_BUCKET:+R2 s3://$R2_BUCKET/state}${R2_BUCKET:-none (state will NOT persist)}"
          echo "translate   : $TRANSLATE_PROVIDER -> $TRANSLATE_TARGET (key: $([ -n "$TRANSLATE_API_KEY" ] && echo set || echo unset))"
          echo "sources     : kcna=${SCRAPE_KCNA:-config} rodong=${SCRAPE_RODONG:-config} vok=${SCRAPE_VOK:-config} 38north=${SCRAPE_38NORTH:-config} dailynk=${SCRAPE_DAILYNK:-config}"
          echo "age window  : ${MAX_AGE_HOURS:-config} hours"

      # Running without R2 is supported, but it must not be *silent*: with no
      # state the run scrapes against an empty database, so the site shows only
      # what the last few hours found and nothing is deduped against history.
      # That looks exactly like a frozen feed, which is worth a warning.
      - name: Check state persistence
        run: |
          set -uo pipefail
          if [ -z "$R2_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning title=Pipeline state is not persisted::R2_BUCKET or the R2 credentials are unset, so this run scraped an empty database. The site will only ever show what these last few hours found, with no cross-run dedup and a cold translation cache. See README: Persisting pipeline state."
            {
              echo "### Pipeline state: **not persisted**"
              echo ""
              echo "No \`R2_BUCKET\` / R2 credentials, so this run started from an empty database."
              echo ""
              echo "- the site shows only what this run found — there is no history"
              echo "- nothing is deduped against earlier runs"
              echo "- the translation cache starts cold, so the same text is retranslated every 6 hours"
              echo ""
              echo "Add the secrets \`R2_ACCESS_KEY_ID\` / \`R2_SECRET_ACCESS_KEY\` and the variables"
              echo "\`R2_ENDPOINT\` / \`R2_BUCKET\` — README, *Persisting pipeline state*."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "state store : R2 s3://$R2_BUCKET/state (persisting)"
          fi

      - name: Restore pipeline state from R2
        if: ${{ inputs.fresh_state != true && vars.R2_BUCKET != '' }}
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path
          mkdir -p data
          aws s3 cp --endpoint-url "$R2_ENDPOINT" "s3://$R2_BUCKET/state/kcna.db" data/kcna.db \
            || echo "no previous database in R2; starting empty"
          aws s3 cp --endpoint-url "$R2_ENDPOINT" "s3://$R2_BUCKET/state/translations.json" \
            data/translations.json || echo "no translation cache yet; everything translates fresh"
          ls -lh data || true

      - name: Scrape and translate
        env:
          LIMIT: ${{ github.event.inputs.limit || '60' }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          set -euo pipefail
          args=(--once --limit "$LIMIT")
          read -r -a srcs <<< "$SOURCES" || true
          for s in "${srcs[@]}"; do args+=(--source "$s"); done
          python -m app.scrape "${args[@]}"

      - name: Publish static site
        env:
          # Relative by default: a project Pages site lives under /<repo>/, so an
          # absolute "/media" path would resolve outside the site. Set MEDIA_BASE to
          # an R2 URL only when the bucket, MIRROR_MEDIA and a CDN are all wired up.
          MEDIA_BASE: ${{ vars.MEDIA_BASE || 'media' }}
        run: |
          set -euo pipefail
          python -m app.publish --out site --media-base "$MEDIA_BASE"

      # publish.py exports JSON that points at media/<hash>/<file>; the scraper writes
      # those bytes to data/media, so they have to be lifted into the deploy directory
      # or every photo on the site 404s while the JSON still claims it exists.
      - name: Stage mirrored media into the site
        run: |
          set -uo pipefail
          if [ -d data/media ] && [ -n "$(ls -A data/media 2>/dev/null)" ]; then
            mkdir -p site/media
            cp -r data/media/. site/media/
            echo "staged $(find site/media -type f | wc -l) media files ($(du -sh site/media | cut -f1))"
          else
            echo "::notice title=No mirrored media::data/media is empty; the site will show 'image unavailable' in its place."
          fi

      - name: Show what was published
        run: cat site/data/manifest.json

      - name: Save pipeline state to R2
        if: ${{ always() && vars.R2_BUCKET != '' }}
        run: |
          set -uo pipefail
          aws configure set default.s3.addressing_style path
          # VACUUM keeps the stored database from growing on every single run.
          command -v sqlite3 >/dev/null 2>&1 && sqlite3 data/kcna.db 'VACUUM' || true
          [ -f data/kcna.db ] && aws s3 cp --endpoint-url "$R2_ENDPOINT" \
            data/kcna.db "s3://$R2_BUCKET/state/kcna.db" || true
          [ -f data/translations.json ] && aws s3 cp --endpoint-url "$R2_ENDPOINT" \
            data/translations.json "s3://$R2_BUCKET/state/translations.json" || true

      - name: Mirror media to R2 (optional)
        if: ${{ vars.MIRROR_MEDIA == '1' && vars.R2_BUCKET != '' }}
        run: |
          set -uo pipefail
          aws s3 sync --endpoint-url "$R2_ENDPOINT" data/media "s3://$R2_BUCKET/media" \
            --exclude '*.tmp' --exclude '_assets/*' || true

      - name: Upload site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
          if-no-files-found: ignore

      # The `secrets` context is not available inside `if:`, so the presence of the
      # Pages credentials is detected here and handed to the deploy step as an output.
      - name: Check Pages deployment configuration
        if: success()
        id: pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$CF_PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Cloudflare Pages secrets are not set; the export is still in the 'site' artifact."
          fi

      # No cloudflare/* marketplace action is used on purpose: there is no
      # cloudflare/pages-action (job setup fails with "Unable to resolve action"
      # before any if: can skip it), and a run step can be skipped cleanly when the
      # credentials are missing. Node ships with the runner, so wrangler comes from
      # npx; major version pinned so a future wrangler 5 cannot break the pipeline.
      - name: Deploy to Cloudflare Pages
        if: steps.pages.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          node --version
          npx --yes wrangler@4 pages deploy site \
            --project-name "$CLOUDFLARE_PROJECT" \
            --branch "${GITHUB_REF_NAME}" \
            --commit-dirty=true

  # GitHub Pages is the host that needs nothing but this workflow: Pages was set to
  # "Deploy from a workflow" (gh api -X POST repos/<owner>/<repo>/pages
  # -f build_type=workflow), so no R2 bucket, no API token and no custom domain are
  # required for the export to become a public site. The Cloudflare job above stays
  # as the optional path for someone who wants a domain of their own.
  #
  # It deliberately depends on pipeline succeeding: deploying an empty or half-built
  # directory would replace a working site with an error page.
  pages:
    needs: pipeline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write        # upload-pages-artifact / deploy-pages
      id-token: write     # OIDC token for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the site directory
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Check what is about to go live
        run: |
          set -uo pipefail
          test -f site/index.html || { echo "::error::site/index.html missing"; exit 1; }
          test -f site/data/articles.json || { echo "::error::no data/articles.json"; exit 1; }
          echo "stories: $(python3 -c 'import json;print(json.load(open("site/data/articles.json"))["count"])')"
          echo "media files: $(find site/media -type f 2>/dev/null | wc -l)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

