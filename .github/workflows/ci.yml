# Fast checks on every push. Everything now runs against requirements-scrape.txt,
# the same set the scheduled pipeline installs, because that is exactly where this
# suite's blind spot was: kiwipiepy was in requirements.txt but not in the CI set,
# the sentence splitter depended on it, and a green pipeline exported nothing.
# The whole suite is affordable here now that Kiwi is part of the scrape install.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-scrape.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt pytest

      - name: Run tests
        run: pytest tests -q

      - name: Publish smoke test (empty database)
        run: |
          set -euo pipefail
          python -c "from app.db import init_db; init_db()"
          python -m app.publish --out site
          python - <<'PY'
          import json, pathlib
          m = json.load(open("site/data/manifest.json"))
          assert m["schema"] == 1 and m["stories"] == 0, m
          for name in ("articles.json", "categories.json", "manifest.json"):
              assert (pathlib.Path("site/data") / name).exists(), name
          print("publish smoke test ok:", m)
          PY
