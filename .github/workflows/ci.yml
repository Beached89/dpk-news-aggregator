# Fast checks on every push. Only the test files that need no heavyweight models
# run here: tests/test_analysis.py exercises the Kiwi tokenizer (kiwipiepy, ~600 MB
# of models) and is meant to be run locally with the full requirements.txt.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-scrape.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt pytest

      - name: Run tests
        run: pytest tests/test_translate.py tests/test_parser.py -q

      - name: Publish smoke test (empty database)
        run: |
          set -euo pipefail
          python -c "from app.db import init_db; init_db()"
          python -m app.publish --out site
          python - <<'PY'
          import json, pathlib
          m = json.load(open("site/data/manifest.json"))
          assert m["schema"] == 1 and m["stories"] == 0, m
          for name in ("articles.json", "categories.json", "manifest.json"):
              assert (pathlib.Path("site/data") / name).exists(), name
          print("publish smoke test ok:", m)
          PY
