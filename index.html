<!-- Version: 3.0.0 — data-driven front end. Content comes from data/*.json,
     written by `python -m app.publish` on every CI run; see assets/app.js. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Jong Lingo — DPRK Newsroom</title>
    <meta name="description" content="North Korean state media, machine-translated Korean to English with the Korean original alongside.">
    <!-- Favicon variants -->
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/images/favicon-48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/favicon-64.png">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --dprk-red: #CC0000;
            --dprk-dark-red: #8B0000;
            --dprk-black: #1A1A1A;
            --dprk-gold: #D4AF37;
        }

        body {
            font-family: "Inter", sans-serif;
            background-color: #F5F5F0; /* warm off-white, like newsprint */
            color: var(--dprk-black);
        }

        h1, h2, h3, h4 { font-family: "Noto Serif", serif; }

        /* Korean needs more leading than Latin at the same size */
        .ko { font-family: "Noto Serif", "Apple SD Gothic Neo", "Malgun Gothic", serif; line-height: 1.85; }

        /* Red star bullet point */
        .star-bullet::before {
            content: "★";
            color: var(--dprk-red);
            margin-right: 6px;
            font-size: 0.75em;
            vertical-align: middle;
        }

        .red-rule { border: none; height: 2px; background-color: var(--dprk-red); }

        .cat-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 2px 6px;
            background-color: var(--dprk-red);
            color: white;
        }

        .news-list-item {
            display: block;
            padding: 10px 0;
            border-bottom: 1px solid #DDD8D0;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .news-list-item:hover { background-color: rgba(204, 0, 0, 0.03); }

        /* Top news ticker */
        .ticker-bar {
            background: linear-gradient(90deg, var(--dprk-red) 0%, var(--dprk-dark-red) 100%);
            overflow: hidden;
        }
        .ticker-content { white-space: nowrap; animation: ticker 45s linear infinite; }
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Language switcher in the header */
        .lang-switch button {
            font-size: 11px;
            padding: 2px 8px;
            color: rgba(255,255,255,0.75);
            background: transparent;
            border: none;
            border-right: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
        }
        .lang-switch button:first-child { padding-left: 0; }
        .lang-switch button:hover { color: white; background: rgba(255,255,255,0.1); }
        .lang-switch button.active { color: white; font-weight: 700; background: var(--dprk-dark-red); }

        /* Category tabs */
        .nav-tab {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 4px 10px;
            background: white;
            border: 1px solid #DDD8D0;
            color: #444;
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-tab:hover { border-color: var(--dprk-red); color: var(--dprk-red); }
        .nav-tab.active { background-color: var(--dprk-red); border-color: var(--dprk-red); color: white; }

        /* Mobile menu */
        #mobile-menu { display: none; }
        #mobile-menu.open { display: block; }

        @media (max-width: 640px) {
            .source-text { font-size: 10px !important; }
            h3.mobile-title { font-size: 1.25rem !important; }
            h4.mobile-subtitle { font-size: 0.95rem !important; }
        }

        /* Reader */
        .para { margin-bottom: 1rem; text-indent: 1.5em; }
        .para-ko { color: #333; }
        .para-en { color: #111; }

        .cover-wrap { background: #EDEAE3; border: 1px solid #DDD8D0; overflow: hidden; }
        .cover-wrap img { display: block; width: 100%; height: auto; }
        .cover-none {
            display: flex; align-items: center; justify-content: center;
            min-height: 120px; color: #999; font-size: 10px;
            letter-spacing: 0.1em; text-transform: uppercase;
        }
        /* Generic pool art for stories with no source photo: washed back so it
           reads as decoration and never as reportage of the story. Delete the
           filter/opacity to run the pool in full colour. */
        .cover-wrap.cover-ph img { opacity: 0.78; filter: saturate(0.35) contrast(0.95) brightness(1.06); }

        [hidden] { display: none !important; }
    </style>
</head>
<body class="bg-[#F5F5F0]">

    <noscript>
        <div class="max-w-6xl mx-auto px-4 py-6">
            <p class="text-sm">This page renders <a class="underline" href="data/articles.json">data/articles.json</a>
            in the browser. Enable JavaScript, or read the JSON export directly.</p>
        </div>
    </noscript>

    <!-- Top News Ticker (real headlines, filled from the export) -->
    <div class="ticker-bar py-2 px-4 text-white text-xs font-bold tracking-wide">
        <div class="max-w-6xl mx-auto">
            <span id="ticker" class="ticker-content">★ TOP NEWS ★ loading…</span>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white border-b-2 border-[#CC0000] sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="#/" class="flex items-center gap-3 no-underline text-inherit">
                <img src="assets/images/header-logo.png" alt="Kim Jong Lingo" class="w-10 h-10 object-contain">
                <div>
                    <h1 class="text-lg font-black tracking-tight uppercase leading-none" style="font-family: 'Noto Serif', serif; color: var(--dprk-red);">Kim Jong Lingo</h1>
                    <p class="text-[10px] text-slate-500 tracking-widest uppercase mt-0.5">DPRK state media, translated — 조선중앙통신</p>
                </div>
            </a>

            <div class="hidden md:block text-right">
                <span class="text-xs font-bold" style="color: var(--dprk-red);"><span id="juche-label">Juche</span></span>
                <br><span class="text-[10px] text-slate-400" id="current-date"></span>
            </div>

            <button id="menu-toggle" class="md:hidden p-2 rounded hover:bg-red-50 touch-manipulation" aria-label="Toggle menu" aria-expanded="false">
                <svg class="w-6 h-6 text-[#CC0000]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>

        <div id="mobile-menu" class="md:hidden border-t border-[#DDD8D0] bg-white">
            <div id="catnav-mobile" class="px-4 py-3 flex flex-col gap-2"></div>
        </div>

        <!-- Language + freshness -->
        <div class="bg-[#CC0000] border-t border-[#8B0000]">
            <div class="max-w-6xl mx-auto px-4 py-1 flex items-center justify-between">
                <nav class="lang-switch flex" aria-label="Display language">
                    <button id="lang-en" type="button">English</button>
                    <button id="lang-ko" type="button">조선어</button>
                </nav>
                <div class="hidden md:flex items-center gap-3 text-[10px] text-white/80">
                    <span id="updated">loading…</span>
                    <a href="https://github.com/Beached89/dpk-news-aggregator" class="hover:text-white" rel="noopener">method</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Category tabs (from data/categories.json) -->
    <nav class="max-w-6xl mx-auto px-4 py-3 flex gap-2 overflow-x-auto" id="catnav" aria-label="Categories"></nav>

    <main class="max-w-6xl mx-auto px-4 pb-4">
        <div id="status" hidden class="bg-white border-2 border-[#CC0000] p-6 mb-6">
            <h2 id="status-title" class="text-sm font-black uppercase tracking-widest mb-2" style="color: var(--dprk-red);"></h2>
            <p id="status-body" class="text-sm text-slate-600"></p>
        </div>

        <div id="view-list"></div>
        <div id="view-article" hidden></div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#1A1A1A] border-t-4 border-[#CC0000] mt-12 py-8">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <img src="assets/images/header-logo.png" alt="" class="w-8 h-8 mx-auto mb-3 opacity-50 object-contain">
            <p class="text-slate-400 text-xs mb-1">Kim Jong Lingo — machine-translated DPRK state media</p>
            <p class="text-slate-600 text-[10px]" id="footer-stats">loading…</p>
            <p class="text-slate-700 text-[10px] mt-2">Translations are automatic and unedited. Check the original before quoting.</p>
        </div>
    </footer>

    <script src="assets/app.js"></script>
</body>
</html>
