{% extends "base.html" %}
{% block title %}{{ title }} · Kim Jong Lingo{% endblock %}
{% block content %}
  <style>
    .mag-reader { display: grid; grid-template-columns: minmax(0, 760px) 1fr; gap: 22px; align-items: start; }
    .mag-page-wrap { position: sticky; top: 42px; background: #2b2b2b; border: 1px solid #c7c2b8;
      display: flex; justify-content: center; }
    .mag-page-wrap img { max-width: 100%; max-height: 500px; object-fit: contain; display: block; }
    .mag-text { min-width: 0; }
    .mag-pagebar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
      border-bottom: 2px solid #161616; padding-bottom: 10px; }
    .mag-ko { font-size: 1.05rem; line-height: 1.7; color: #161616; white-space: pre-wrap; }
    .mag-en { font-size: .95rem; line-height: 1.6; color: #6f6f6f; white-space: pre-wrap;
      margin-top: 16px; padding-top: 14px; border-top: 1px solid #e0ddd6; }
    @media (max-width: 760px) { .mag-reader { grid-template-columns: 1fr; }
      .mag-page-wrap { position: static; } .mag-page-wrap img { max-height: 40vh; } }
  </style>
  <p class="back"><a href="/magazines">← 잡지 목록</a></p>
  <h1 class="article-main-title video-title-top">{{ title }}</h1>

  {% if pages %}
  <div class="mag-reader" id="mag-reader">
    <div class="mag-page-wrap">
      <img id="mag-img" src="{{ pages[0].img }}" alt="page">
    </div>
    <div class="mag-text">
      <div class="mag-pagebar">
        <button id="mag-prev" class="pv-btn">◀</button>
        <span class="pv-pages"><input id="mag-page" type="number" min="1" value="1"> / <span id="mag-count">{{ pages|length }}</span></span>
        <button id="mag-next" class="pv-btn">▶</button>
      </div>
      <div class="mag-en" id="mag-en"></div>
    </div>
  </div>

  {% if source_url %}
  <p class="source"><span class="source-label">원문 / Original:</span>
    <a href="{{ source_url }}" rel="noreferrer">korean-books.com.kp (PDF)</a></p>
  {% endif %}

  <script>
    (function () {
      const PAGES = {{ pages|tojson }};
      const img = document.getElementById('mag-img');
      const enEl = document.getElementById('mag-en');
      const input = document.getElementById('mag-page');
      let i = 0;
      function show(n) {
        i = Math.max(0, Math.min(PAGES.length - 1, n));
        const p = PAGES[i];
        img.src = p.img;
        enEl.textContent = p.en || '(이 페이지에는 번역할 본문이 없습니다)';
        input.value = i + 1;
        window.scrollTo({top: 0, behavior: 'smooth'});
      }
      document.getElementById('mag-prev').addEventListener('click', () => show(i - 1));
      document.getElementById('mag-next').addEventListener('click', () => show(i + 1));
      input.addEventListener('change', () => show((parseInt(input.value, 10) || 1) - 1));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') show(i - 1);
        else if (e.key === 'ArrowRight') show(i + 1);
      });
      show(0);
    })();
  </script>
  {% else %}
    <p class="empty">페이지를 불러올 수 없습니다.</p>
  {% endif %}
{% endblock %}
